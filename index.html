<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Divisas</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dólar al Día">
  <meta name="theme-color" content="#0f172a">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = saved || (prefersLight ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0f172a');
    })();
  </script>
  <style>
    /* Variables y Reset Base */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --card-active-border: #38bdf8;
      --card-active-bg: rgba(56, 189, 248, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --input-bg: #0b1120;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-active-border: #0284c7;
      --card-active-bg: rgba(2, 132, 199, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --input-bg: #f1f5f9;
    }

    body, .rate-card, .calculator, .calc-input, .install-btn, .theme-toggle-btn, .copy-btn {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      gap: 0.5rem;
      padding-top: 0.25rem;
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo {
      display: block;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.15));
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .theme-toggle-btn {
      position: absolute;
      right: 0;
      top: 0;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 0.5rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .theme-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .theme-toggle-btn .sun-icon {
      display: block;
    }
    .theme-toggle-btn .moon-icon {
      display: none;
    }

    [data-theme="light"] .theme-toggle-btn .sun-icon {
      display: none;
    }
    [data-theme="light"] .theme-toggle-btn .moon-icon {
      display: block;
    }

    /* Panel de Tasas (Grid Superior) */
    .rates-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    .rate-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.75rem 0.25rem;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      user-select: none;
      color: inherit;
    }

    .rate-card:hover {
      border-color: #475569;
    }

    .rate-card.active {
      border-color: var(--card-active-border);
      background-color: var(--card-active-bg);
    }

    .rate-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .label-title {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .rate-card.active .rate-title {
      color: var(--accent);
    }

    .rate-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Calculadora Bidireccional (Bloque Inferior) */
    .calculator {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-currency-badge {
      position: absolute;
      left: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .calc-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 0.75rem 2.4rem 0.75rem 2.2rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
      -moz-appearance: textfield;
    }

    .calc-input::-webkit-outer-spin-button,
    .calc-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .calc-input:focus {
      border-color: var(--accent);
    }

    .copy-btn {
      position: absolute;
      right: 0.5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.45rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] .copy-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .copy-btn:active {
      transform: scale(0.92);
    }

    .copy-btn.copied {
      color: #10b981;
    }

    /* Fechas de Actualización */
    .timestamp-info {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      min-height: 1rem;
    }

    /* Botón Instalar PWA */
    .install-btn {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s ease;
      width: 100%;
    }

    .install-btn:hover {
      background-color: var(--card-active-bg);
    }

    @media all and (display-mode: standalone) {
      #install-btn {
        display: none !important;
      }
    }

    /* Pie de página / Créditos */
    .app-footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: -0.25rem;
    }

    .app-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: text-decoration 0.15s ease;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand-logo-container">
        <svg class="brand-logo" width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="46" height="46" rx="14" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="15" fill="var(--card-active-bg)"/>
          <path d="M16 19h16m0 0l-3.5-3.5M32 19l-3.5 3.5" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 29H16m0 0l3.5 3.5M16 29l3.5-3.5" stroke="var(--text-main)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Monitor de Divisas</h1>
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Cambiar tema">
        <!-- Sol: visible en modo oscuro para cambiar a claro -->
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Luna: visible en modo claro para cambiar a oscuro -->
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <!-- Panel de Tasas (Grid Superior: 3 botones) -->
    <section class="rates-grid" id="rates-grid">
      <button type="button" class="rate-card" data-rate-id="usdt">
        <span class="rate-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1.2 5.5h3.4v2.1h-3.4v1.1c2.4.1 4.2.6 4.2 1.2s-1.8 1.1-4.2 1.2v3.9h-2.4v-3.9c-2.4-.1-4.2-.6-4.2-1.2s1.8-1.1 4.2-1.2V9.6H7.4V7.5h3.4V5.8h2.4zm-1.2 4.4c-2 0-3.3.3-3.3.7s1.3.7 3.3.7 3.3-.3 3.3-.7-1.3-.7-3.3-.7z"/>
          </svg>
          Tasa USDT
        </span>
        <span class="rate-value" id="rate-val-usdt">--</span>
      </button>
      <button type="button" class="rate-card active" data-rate-id="bcv">
        <span class="rate-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          Tasa BCV
        </span>
        <span class="rate-value" id="rate-val-bcv">--</span>
      </button>
      <button type="button" class="rate-card" data-rate-id="euro">
        <span class="rate-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h12M4 14h9M18.8 7.5a8 8 0 1 0 0 9"/>
          </svg>
          Tasa Euro
        </span>
        <span class="rate-value" id="rate-val-euro">--</span>
      </button>
    </section>

    <!-- Calculadora Bidireccional (Bloque Inferior) -->
    <main class="calculator">
      <!-- Entrada Divisa Extranjera (dinámica según tasa seleccionada) -->
      <div class="input-group">
        <label for="foreign-input" class="input-label">
          <span class="label-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v12M15 9.5a2.5 2.5 0 0 0-5 0c0 2.5 5 1.5 5 4a2.5 2.5 0 0 1-5 0"/>
            </svg>
            <span id="foreign-label">Dólares (BCV)</span>
          </span>
        </label>
        <div class="input-wrapper">
          <span class="input-currency-badge" id="foreign-symbol">$</span>
          <input 
            type="number" 
            id="foreign-input" 
            class="calc-input" 
            placeholder="0.00" 
            step="any" 
            min="0"
            inputmode="decimal"
          >
          <button type="button" class="copy-btn" id="copy-foreign-btn" title="Copiar monto" aria-label="Copiar monto">
            <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Entrada Bolívares (VES) -->
      <div class="input-group">
        <label for="ves-input" class="input-label">
          <span class="label-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="12" x="2" y="6" rx="2"/>
              <circle cx="12" cy="12" r="2"/>
              <path d="M6 12h.01M18 12h.01"/>
            </svg>
            <span>Bolívares (VES)</span>
          </span>
        </label>
        <div class="input-wrapper">
          <span class="input-currency-badge">Bs</span>
          <input 
            type="number" 
            id="ves-input" 
            class="calc-input" 
            placeholder="0.00" 
            step="any" 
            min="0"
            inputmode="decimal"
          >
          <button type="button" class="copy-btn" id="copy-ves-btn" title="Copiar monto" aria-label="Copiar monto">
            <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Fechas de Actualización -->
      <div class="timestamp-info" id="update-timestamp">
        Corte de tasa: Sincronizando...
      </div>
    </main>

    <!-- Botón Instalar App (Solo en navegador web, oculto si ya es PWA instalada) -->
    <button id="install-btn" class="install-btn" type="button">
      📲 Instalar aplicación
    </button>

    <!-- Créditos / Sitio Web -->
    <footer class="app-footer">
      <p>Desarrollado por <a href="https://oman-vasquez.web.app" target="_blank" rel="noopener noreferrer">Oman Vasquez</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.error('Fallo en el registro del SW:', err));
      });
    }
  </script>
</body>
</html>
